plugins {
    id 'com.android.application'
}

android {
    namespace 'com.siege.castles'
    compileSdk 35

    defaultConfig {
        applicationId 'com.siege.castles'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '2.3'
    }

    // Release signing key is read from keystore.properties (kept out of git).
    // Without it, the build is signed with the standard debug key.
    def keyProps = new Properties()
    def keyFile = rootProject.file('keystore.properties')
    if (keyFile.exists()) {
        keyFile.withInputStream { keyProps.load(it) }
    }

    signingConfigs {
        if (keyFile.exists()) {
            release {
                storeFile rootProject.file(keyProps['storeFile'])
                storePassword keyProps['storePassword']
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keyFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
