<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#151c26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>حصار القلاع</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#0b1018;color:#ece6d6;font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{background:linear-gradient(#1e2733,#151c26);padding:calc(env(safe-area-inset-top) + 5px) 8px 5px;border-bottom:1px solid #2b3646;flex:0 0 auto}
#resBar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.r{background:#0f151e;border:1px solid #2a3443;border-radius:8px;padding:3px 4px;display:flex;align-items:center;gap:3px;font-size:13px;font-weight:700;direction:ltr;justify-content:center}
.r small{font-size:9px;color:#86efac;font-weight:400}
.row2{display:flex;align-items:center;gap:6px;margin-top:5px}
.hpw{flex:1;display:flex;flex-direction:column;gap:2px;font-size:10px;color:#a8b2c1}
.hpb{height:7px;background:#2a2f38;border-radius:4px;overflow:hidden}
.hpb i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#60a5fa,#2563eb);transition:width .3s}
.hpb.en i{background:linear-gradient(90deg,#f87171,#b91c1c)}
#clock{font-size:13px;font-weight:700;color:#fbbf24;min-width:42px;text-align:center;direction:ltr}
.ib{background:#263142;border:1px solid #3a4658;color:#ece6d6;border-radius:8px;height:30px;min-width:34px;font-size:14px;padding:0 6px}
#stage{flex:1 1 auto;position:relative;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none}
#zoomBox{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;z-index:4}
#zoomBox button{width:40px;height:40px;border-radius:12px;border:1px solid #3d4b60;background:rgba(22,29,40,.86);color:#fff;font-size:20px;font-weight:700;padding:0;font-family:inherit}
#zoomBox button:active{transform:scale(.92)}
#zAlert{background:rgba(127,29,29,.92)!important;border-color:#ef4444!important;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
#panel{flex:0 0 auto;background:#151c26;border-top:1px solid #2b3646;padding-bottom:env(safe-area-inset-bottom)}
#tabs{display:flex}
#tabs button{flex:1;background:none;border:none;border-bottom:2px solid transparent;color:#8e99a8;padding:8px 2px 6px;font-size:14px;font-weight:700;font-family:inherit}
#tabs button.on{color:#fbbf24;border-bottom-color:#fbbf24}
#tabs b{background:#fbbf24;color:#111;border-radius:9px;padding:0 6px;font-size:11px;margin-right:3px}
#tabBody{height:118px;display:flex;gap:6px;padding:6px 8px 8px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;scrollbar-width:none}
#tabBody::-webkit-scrollbar{display:none}
#tabBody.grid{display:block;overflow:hidden}
.card{flex:0 0 82px;background:linear-gradient(#253042,#1c2533);border:1px solid #344257;border-radius:11px;color:inherit;padding:4px 3px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-family:inherit;position:relative}
.card:active{transform:scale(.94)}
.card .ic{font-size:24px;line-height:1.1}
.card .nm{font-weight:700;font-size:12px}
.card .in{font-size:9px;color:#9aa6b6;text-align:center;line-height:1.2}
.card .co{font-size:10px;direction:ltr;display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.co .no{color:#f87171}
.card.dis{opacity:.45}
.card .q{position:absolute;top:2px;left:4px;font-size:10px;color:#fbbf24;font-weight:700}
.card.tool{background:linear-gradient(#3b3223,#2a241a);border-color:#6b5a32}
.card.tool.red{background:linear-gradient(#3e2222,#2b1818);border-color:#7f3535}
.card.on{outline:2px solid #fbbf24}
.selinfo{font-size:12px;color:#cbd5e1;margin-bottom:6px;height:16px;white-space:nowrap;overflow:hidden}
.cg{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.cg button{height:40px;background:#243043;border:1px solid #3a4a61;color:#ece6d6;border-radius:9px;font-size:11.5px;font-weight:700;font-family:inherit;padding:0 2px;line-height:1.15}
.cg button:active{transform:scale(.94)}
.cg .atk{background:#5b1e1e;border-color:#9b3434}
.cg .def{background:#1e3a5b;border-color:#2f5d93}
#placeBar{position:absolute;top:8px;left:8px;right:8px;background:rgba(17,23,33,.94);border:1px solid #fbbf24;border-radius:12px;padding:6px 8px;display:flex;align-items:center;gap:6px;z-index:5}
#placeBar.demo{border-color:#ef4444}
#placeBar span{flex:1;font-size:12px}
#placeBar button{height:34px;border-radius:9px;border:1px solid #4b5a70;background:#263142;color:#fff;font-size:13px;font-weight:700;padding:0 10px;font-family:inherit;white-space:nowrap}
#pOk{background:#166534!important;border-color:#22c55e!important}
#placeBar.demo #pOk{background:#7f1d1d!important;border-color:#ef4444!important}
.hidden{display:none!important}
#toast{position:absolute;top:56px;left:50%;transform:translateX(-50%);background:rgba(10,14,20,.92);border:1px solid #475569;padding:7px 14px;border-radius:20px;font-size:13px;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none;z-index:6;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}
#ov{position:fixed;inset:0;background:rgba(6,9,14,.86);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.box{width:100%;max-width:380px;background:linear-gradient(#1f2836,#151c26);border:1px solid #3d4b60;border-radius:18px;padding:18px 16px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6);max-height:92vh;overflow:auto;touch-action:pan-y}
.box h1{margin:0 0 4px;font-size:28px;color:#fbbf24;text-shadow:0 2px 0 #7c2d12}
.box .sub{margin:0 0 14px;color:#b6c0ce;font-size:13px}
.seg{display:flex;gap:6px;margin:8px 0 14px}
.seg button{flex:1;height:40px;border-radius:10px;border:1px solid #3d4b60;background:#202a38;color:#ddd;font-weight:700;font-size:14px;font-family:inherit}
.seg button.on{background:#7c5a12;border-color:#fbbf24;color:#fff}
.big{width:100%;height:50px;border-radius:13px;border:none;background:linear-gradient(#f59e0b,#b45309);color:#1a1205;font-size:18px;font-weight:800;font-family:inherit;margin-top:4px}
.big.alt{background:#2a3546;color:#e5e7eb;border:1px solid #475569;margin-top:8px;font-size:15px;height:44px}
details{text-align:right;margin-top:12px;background:#121821;border-radius:10px;padding:8px 10px;font-size:12.5px;color:#c6cfdb}
summary{font-weight:700;color:#fbbf24;font-size:13px}
details ul{margin:6px 0 0;padding-right:18px;line-height:1.7}
.res-end{font-size:15px;color:#cbd5e1;margin:6px 0 14px}
.lbl{font-size:13px;color:#cbd5e1;margin-top:4px}
.big.mp{background:linear-gradient(#3b82f6,#1d4ed8);color:#fff;margin-top:10px}
.opt{display:block;width:100%;text-align:right;background:#1b2432;border:1px solid #3d4b60;border-radius:14px;padding:12px 14px;margin:8px 0;color:#ece6d6;font-family:inherit}
.opt b{display:block;font-size:17px;margin-bottom:3px}
.opt small{color:#a8b2c1;font-size:12px;line-height:1.5}
.opt:active{transform:scale(.97)}
.or{color:#8e99a8;font-size:12px;margin:10px 0 6px}
.code-in{width:100%;height:50px;border-radius:12px;border:1px solid #475569;background:#0f151e;color:#fff;font-size:26px;letter-spacing:8px;text-align:center;font-weight:800;direction:ltr;text-transform:uppercase;-webkit-user-select:text;user-select:text;font-family:ui-monospace,Menlo,monospace}
.bigcode{font-size:44px;font-weight:900;letter-spacing:10px;color:#fbbf24;background:#0f151e;border:1px dashed #fbbf24;border-radius:14px;padding:10px 0;margin:6px 0 10px;font-family:ui-monospace,Menlo,monospace}
.row2b{display:flex;gap:8px;margin:6px 0}
.sm{flex:1;height:40px;border-radius:10px;border:1px solid #475569;background:#263142;color:#fff;font-weight:700;font-size:14px;font-family:inherit}
.st{min-height:20px;font-size:13px;color:#fde68a;margin:10px 0 4px;line-height:1.6}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #fbbf24;border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-1px;margin-left:4px}
@keyframes sp{to{transform:rotate(360deg)}}
.step{text-align:right;font-size:13px;font-weight:700;color:#e2e8f0;margin:12px 0 6px}
.qr{display:block;width:100%;max-width:290px;margin:0 auto;border-radius:10px;image-rendering:pixelated;background:#fff}
.vid{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-top:8px;background:#000;border:2px solid #fbbf24}
details.paste textarea{width:100%;height:80px;margin-top:6px;border-radius:10px;border:1px solid #475569;background:#0f151e;color:#e5e7eb;font-size:11px;font-family:ui-monospace,monospace;-webkit-user-select:text;user-select:text}

</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="resBar"></div>
    <div class="row2">
      <div class="hpw"><span>🏰 قلعتك</span><div class="hpb"><i id="hpMe"></i></div></div>
      <div id="clock">00:00</div>
      <div class="hpw"><span>🏯 قلعة العدو</span><div class="hpb en"><i id="hpEn"></i></div></div>
      <button class="ib" id="btnSpeed">×1</button>
      <button class="ib" id="btnPause">⏸</button>
    </div>
  </header>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="placeBar" class="hidden"><span id="placeTxt"></span><button id="pRot">↻</button><button id="pOk">✔ ابنِ</button><button id="pNo">✖</button></div>
    <div id="zoomBox"><button id="zAlert" class="hidden">📍</button><button id="zIn">＋</button><button id="zOut">－</button><button id="zHome">🏰</button></div>
    <div id="toast"></div>
  </main>
  <footer id="panel">
    <nav id="tabs"><button data-tab="army" class="on">⚔️ الجيش</button><button data-tab="build">🏗️ البناء</button><button data-tab="cmd">🎯 الأوامر<b id="selCount" class="hidden"></b></button></nav>
    <div id="tabBody"></div>
  </footer>
</div>
<div id="ov"><div class="box" id="ovBox"></div></div>

<!-- مكتبات مدمجة ليعمل الملف دون أي تحميل خارجي -->

/* ---------- الحركة ---------- */

    addProj({kind:'stone', atype:'trebuchet', team:u.team, x0, y0, x1, y1, t:0, dur:1.2 + Math.hypot(x1-x0, y1-y0) * .03, target:t});
  } else {
    u.lunge = .15; u.lx = x1 - x0; u.ly = y1 - y0;
    damage(t, calcDmg(u.type, t));
    sparks(x1 - (x1-x0)*.3, y1 - (y1-y0)*.3, t.kind === 's' ? '#d6c7a8' : '#ffd36b', 4);
  }
}
function shoot(atype, team, x0, y0, t){
  const [x1, y1] = center(t);
  addProj({kind:'arrow', atype, team, x0, y0, x1, y1, t:0, dur:Math.hypot(x1-x0, y1-y0)/14 + .05, target:t});
}
function addProj(p){
  G.proj.push(p);
  if (isHostMP()) G.nProj.push([p.kind === 'arrow' ? 0 : 1, r2(p.x0), r2(p.y0), r2(p.x1), r2(p.y1), r2(p.dur), p.target ? (p.target.kind === 'u' ? p.target.id : -p.target.id) : 0]);
}
function damage(t, amt){
  if (t.dead) return;
  t.hp -= amt; t.hitT = .15;
  alertHit(t);
  if (t.hp <= 0){ if (t.kind === 'u') killUnit(t); else destroyStruct(t); }
}
function nearestEnemyUnit(team, x, y, range){
  let best = null, bd = 1e9;
  for (const e of G.units.values()){
    if (e.team === team) continue;
    if (Math.abs(e.px - x) > range + 2 || Math.abs(e.py - y) > range + 2) continue;
    const d = distPR(x, y, uRect(e));
    if (d <= range && d < bd){ bd = d; best = e; }
  }
  return best;
}

/* ---------- سلوك الوحدات حسب الأوامر ---------- */
function chase(u, t, dt, breach){
  const r = t.kind === 'u' ? {x:t.cx, y:t.cy, w:t.size, h:t.size} : sRect(t);
  const d = UDEF[u.type], rg = d.range, hs = u.size / 2;
  const res = ensurePath(u, 'c' + t.id, (x, y) => { const dd = distPR(x + hs, y + hs, r); return dd <= rg && (!d.minRange || dd >= d.minRange); },
                         breach, t.kind === 'u' ? .8 : 2.5, (x, y) => Math.max(0, distPR(x + hs, y + hs, r) - rg));
  if (res === 'none'){ u.fails++; }
  stepAlong(u, dt);
}
function updateUnit(u, dt){
  if (u.cd > 0) u.cd -= dt;
  if (u.repathT > 0) u.repathT -= dt;
  if (u.fire > 0) u.fire -= dt;
  if (u.lunge > 0) u.lunge -= dt;
  if (u.moving){ advanceMove(u, dt); return; }
  if (u.obstacle){
    const ob = u.obstacle;
    if (ob.dead || !inReach(u, ob) || !canHit(u, ob)) u.obstacle = null;
    else { attackIfReady(u, ob); return; }
  }
  switch (u.order.type){
    case 'idle': doIdle(u, dt); break;
    case 'move': doMove(u, dt); break;
    case 'attack': doAttackOrder(u, dt); break;
    case 'assault': doAssault(u, dt); break;
    case 'build': case 'repair': case 'demolish': doWork(u, dt); break;
  }
}
function doIdle(u, dt){
  const d = UDEF[u.type], o = u.order, wall = onOwnWall(u);
  const radius = u.type === 'trebuchet' ? d.range : effRange(u) + (d.range > 1 ? 1 : 2.5);
  const t = u.type === 'trebuchet' ? acquire(u, d.range) : pickTarget(u, radius);
  if (t){
    if (inReach(u, t)){ attackIfReady(u, t); u.path = []; return; }
    if (!wall && u.type !== 'trebuchet' && Math.hypot(u.cx - o.hx, u.cy - o.hy) < 4){ chase(u, t, dt, false); return; }
  }
  if (o.hx != null && Math.hypot(u.cx - o.hx, u.cy - o.hy) > 1.5){
    ensurePath(u, 'hold', (x, y) => Math.abs(x - o.hx) <= 1 && Math.abs(y - o.hy) <= 1, false, 3, (x, y) => Math.max(0, Math.hypot(x - o.hx, y - o.hy) - 1.5));
    stepAlong(u, dt);
  }
}
function doMove(u, dt){
  const o = u.order, treb = u.type === 'trebuchet';
  const goal = treb ? (x, y) => Math.abs(x - o.x) <= 1 && Math.abs(y - o.y) <= 1 : (x, y) => x === o.x && y === o.y;
  if (goal(u.cx, u.cy)){ setIdle(u); return; }
  const r = ensurePath(u, 'mv', goal, false, 3, (x, y) => Math.max(0, Math.hypot(x - o.x, y - o.y) - (treb ? 1.5 : 0)));
  if (r === 'none'){ if (++u.fails >= 3){ setIdle(u); return; } }
  stepAlong(u, dt);
  if (u.blockedT > 2 && u.path.length <= 1) setIdle(u);
}
function doAttackOrder(u, dt){
  let t = u.order.target;
  if (!t || t.dead){ setIdle(u); return; }
  if (!canHit(u, t)){ const w = structAt(t.cx, t.cy); if (w){ u.order.target = w; t = w; } else { setIdle(u); return; } }
  if (inReach(u, t)){ attackIfReady(u, t); u.path = []; return; }
  if (u.type !== 'trebuchet'){ const n = acquire(u, effRange(u)); if (n && inReach(u, n) && n !== t){ attackIfReady(u, n); return; } }
  chase(u, t, dt, true);
  if (u.fails >= 4){ setIdle(u); }
}
function trebFront(u){ const tm = TEAM[u.team]; return isNeutral(u.cy) || isNeutral(u.cy + 1) ? tm.nFront : tm.front; }
function doAssault(u, dt){
  const d = UDEF[u.type];
  if (u.type === 'trebuchet'){
    const t = acquire(u, d.range);
    if (t && inReach(u, t)){ attackIfReady(u, t); return; }
    const fy = trebFront(u);
    if (u.cy !== fy){
      const r = ensurePath(u, 'front', (x, y) => y === fy, false, 3, (x, y) => Math.abs(y - fy));
      if (r === 'none' && ++u.fails > 3) setIdle(u);
      stepAlong(u, dt);
    }
    return;
  }
  const t = pickTarget(u, effRange(u) + (d.range > 1 ? 1.5 : 2.5));
  if (t){
    if (inReach(u, t)){ attackIfReady(u, t); u.path = []; return; }
    chase(u, t, dt, true); return;
  }
  const ek = G.keep[1 - u.team];
  if (!ek || ek.dead) return;
  const o = u.order;
  if (o.via){
    const [vx, vy] = o.via;
    if (Math.hypot(u.cx - vx, u.cy - vy) <= 2.5) o.via = null;
    else {
      const r = ensurePath(u, 'via', (x, y) => Math.hypot(x - vx, y - vy) <= 2, false, 3, (x, y) => Math.max(0, Math.hypot(x - vx, y - vy) - 2));
      if (r === 'none' && ++u.fails > 3){ o.via = null; u.fails = 0; }
      stepAlong(u, dt); return;
    }
  }
  if (inReach(u, ek)){ attackIfReady(u, ek); return; }
  const r = sRect(ek), rg = d.range;
  ensurePath(u, 'keep', (x, y) => distPR(x + .5, y + .5, r) <= rg, true, 3, (x, y) => Math.max(0, distPR(x + .5, y + .5, r) - rg));
  stepAlong(u, dt);
}
function doWork(u, dt){
  const o = u.order, s = o.target;
  if (!s || s.dead || (o.type === 'build' && s.built) || (o.type === 'repair' && (s.hp >= s.maxHp || s.demo)) || (o.type === 'demolish' && !s.demo)){ setIdle(u); return; }
  const r = sRect(s);
  if (distPR(uCx(u), uCy(u), r) <= 1.05){
    u.path = [];
    const rate = UDEF[u.type].build, sd = SDEF[s.type];
    if (o.type === 'build'){
      const inc = dt / sd.time * rate;
      s.progress += inc;
      s.hp = Math.min(s.maxHp, s.hp + s.maxHp * inc * .9);
      if (s.progress >= 1){ s.progress = 1; s.built = true; onBuilt(s); }
    } else if (o.type === 'repair'){
      const amt = s.maxHp * .07 * dt * rate, need = amt * .06, R = G.res[u.team];
      if (R[sd.mat] >= need){ R[sd.mat] -= need; s.hp = Math.min(s.maxHp, s.hp + amt); }
      else { notify(u.team, 'لا يوجد ' + RNAME[sd.mat] + ' كافٍ للإصلاح'); setIdle(u); return; }
    } else {
      s.hp -= s.maxHp * dt / 4 * Math.max(.6, rate);
      s.hitT = .1;
      if (s.hp <= 0){ finishDemolish(s); setIdle(u); return; }
    }
    if (Math.random() < dt * 4) sparks(s.x + Math.random()*s.w, s.y + Math.random()*s.h, o.type === 'demolish' ? '#b9a58a' : '#ffd68a', 2);
    return;
  }
  const res = ensurePath(u, 'w' + s.id, (x, y) => distPR(x + .5, y + .5, r) <= 1, false, 2.5, (x, y) => Math.max(0, distPR(x + .5, y + .5, r) - 1));
  if (res === 'none' && ++u.fails >= 3){
    notify(u.team, 'تعذّر وصول الجندي إلى موقع العمل');
    setIdle(u); return;
  }
  stepAlong(u, dt);
}
function onBuilt(s){
  notify(s.team, '✅ اكتمل بناء: ' + SDEF[s.type].name);
  for (const u of G.units.values()) if (u.order.target === s && u.order.type === 'build') setIdle(u);
}
function workersOn(s){ for (const u of G.units.values()) if ((u.order.type === 'build' || u.order.type === 'repair' || u.order.type === 'demolish') && u.order.target === s) return true; return false; }
function nearestWorker(T, s, idleOnly){
  let best = null, bd = 1e9; const r = sRect(s);
  for (const u of G.units.values()){
    if (u.team !== T || u.type === 'trebuchet') continue;
    if (idleOnly && u.order.type !== 'idle') continue;
    if (!idleOnly && u.order.type === 'assault') continue;
    let d = distPR(uCx(u), uCy(u), r);
    if (u.type === 'footman') d -= 2;
    if (u.type === 'knight') d += 1;
    if (onOwnWall(u)) d += 6;
    if (d < bd){ bd = d; best = u; }
  }
  return best;
}
function autoAssign(){
  for (const s of G.structs.values()){
    if ((s.built && !s.demo) || workersOn(s)) continue;
    const u = nearestWorker(s.team, s, true);
    if (u) orderWork(u, s.demo ? 'demolish' : 'build', s);
  }
}

/* ---------- المقذوفات والمؤثرات ---------- */
function updateProj(dt){
  for (let i = G.proj.length - 1; i >= 0; i--){
    const p = G.proj[i]; p.t += dt;
    if (p.kind === 'arrow' && p.target && !p.target.dead){ const c = center(p.target); p.x1 = c[0]; p.y1 = c[1]; }
    if (p.t < p.dur) continue;
    G.proj.splice(i, 1);
    if (p.kind === 'arrow'){ if (p.target && !p.target.dead) damage(p.target, calcDmg(p.atype, p.target)); }
    else {
      const sp = UDEF.trebuchet.splash;
      if (p.target && !p.target.dead && p.target.kind === 's') damage(p.target, calcDmg('trebuchet', p.target));
      for (const s of [...G.structs.values()]){
        if (s.team === p.team || s === p.target) continue;
        if (Math.abs(s.x - p.x1) > 8 || Math.abs(s.y - p.y1) > 8) continue;
        if (distPR(p.x1, p.y1, sRect(s)) <= .45) damage(s, calcDmg('trebuchet', s) * .5);
      }
      for (const u of [...G.units.values()]){
        if (u.team === p.team) continue;
        if (distPR(p.x1, p.y1, uRect(u)) <= sp) damage(u, calcDmg('trebuchet', u));
      }
      puff(p.x1, p.y1, '#a39782', 16, 2.4);
      if (!HEADLESS && !G.demo && inView(p.x1 - 2, p.y1 - 2, 4, 4)) G.shake = Math.max(G.shake, .25);
    }
  }
}
function puff(x, y, col, n, spd){
  if (HEADLESS) return;
  if (isHostMP()) G.nFx.push([r1(x), r1(y), col, n, spd]);
  for (let k = 0; k < n; k++){
    const a = Math.random()*6.28, v = Math.random()*spd;
    G.fx.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:.5 + Math.random()*.5, max:1, col, sz:.08 + Math.random()*.12});
  }
}
function sparks(x, y, col, n){ puff(x, y, col, n, 1.6); }
function updateFx(dt){
  for (let i = G.fx.length - 1; i >= 0; i--){
    const f = G.fx[i]; f.life -= dt;
    if (f.life <= 0){ G.fx.splice(i, 1); continue; }
    f.x += (f.vx || 0) * dt; f.y += (f.vy || 0) * dt;
    if (!f.txt){ f.vx *= .9; f.vy *= .9; }
  }
  for (let i = G.pings.length - 1; i >= 0; i--){ G.pings[i].life -= dt; if (G.pings[i].life <= 0) G.pings.splice(i, 1); }
  for (let i = markers.length - 1; i >= 0; i--){ markers[i].life -= dt; if (markers[i].life <= 0) markers.splice(i, 1); }
  if (G.shake > 0) G.shake -= dt;
}
function alertHit(t){
  if (HEADLESS || !G || G.demo) return;
  const T = t.team;
  if (T !== ME && !isHostMP()) return;
  if (t.kind === 'u' && !inRows(T, t.cy)) return;
  if (G.t - G.alertT[T] > 9){
    G.alertT[T] = G.t;
    const msg = t.kind === 's' ? (t.type === 'keep' ? '⚠️ حصنك يتعرّض للهجوم!' : '⚠️ منشآتك تتعرّض للهجوم!') : '⚠️ العدو داخل أرضك!';
    if (T === ME){ toast(msg); buzz(40); } else G.nEv.push(['t', msg, 1]);
  }
  if (G.t - G.pingT[T] > 1.2){
    G.pingT[T] = G.t; const c = center(t);
    if (T === ME){ G.pings.push({x:c[0], y:c[1], life:2.5}); G.lastAlert = {x:c[0], y:c[1], t:G.t}; }
    else G.nEv.push(['p', r1(c[0]), r1(c[1])]);
  }
}
function buzz(p){ if (!HEADLESS && navigator.vibrate) try { navigator.vibrate(p); } catch(e){} }

/* ================== الحلقة الرئيسية ================== */
function update(dt){
  if (!G || G.over) return;
  G.t += dt;
  for (let T = 0; T < 2; T++){ const r = rates(T), R = G.res[T]; for (const k of RES) R[k] += r[k] * dt; }
  for (const s of G.structs.values()){
    if (s.hitT > 0) s.hitT -= dt;
    if (!s.built || s.demo) continue;
    const sd = SDEF[s.type];
    if (s.queue && s.queue.length){
      const q = s.queue[0]; q.t += dt;
      const ud = UDEF[q.type];
      if (q.t >= ud.time){
        const sp = findFreeNear(s, ud.size);
        if (sp){ makeUnit(q.type, s.team, sp[0], sp[1]); s.queue.shift(); }
        else q.t = ud.time;
      }
    }
    if (sd.range){
      s.cd -= dt;
      if (s.cd <= 0){
        const cx = s.x + s.w/2, cy = s.y + s.h/2;
        const t = nearestEnemyUnit(s.team, cx, cy, sd.range);
        if (t){ shoot(s.type, s.team, cx, cy, t); s.cd = sd.cd; } else s.cd = .25;
      }
    }
  }
  for (const u of G.units.values()){ if (u.hitT > 0) u.hitT -= dt; updateUnit(u, dt); }
  updateProj(dt);
  updateFx(dt);
  G.assignT -= dt;
  if (G.assignT <= 0){ G.assignT = 1; autoAssign(); }
  for (let T = 0; T < 2; T++){
    const ai = G.ai[T]; if (!ai) continue;
    ai.t -= dt;
    if (ai.t <= 0){ ai.t = DIFF[G.diff].think; aiThink(ai); }
  }
}
function endGame(w){
  if (G.over) return;
  G.over = true; G.winner = w;
  if (!HEADLESS && !G.demo) setTimeout(showEnd, 1300);
}

/* ================== الذكاء الاصطناعي ================== */
function wallScore(T, u, x, y){
  const C = CASTLE[T]; let crowd = 0;
  for (const v of G.units.values()) if (v !== u && v.team === T && v.type === 'archer' && Math.abs(v.cx - x) + Math.abs(v.cy - y) <= 3 && (onOwnWall(v) || (v.order.type === 'move' && isRing(T, v.order.x, v.order.y)))) crowd++;
  return Math.abs(x - u.cx) * .3 + Math.abs(y - u.cy) * .3 + Math.abs(y - C.frontY) * .25 + crowd * 6;
}
function freeWallCell(T, u, taken){
  let best = null, bd = 1e9;
  for (const [x, y] of CASTLE[T].ring){
    const s = structAt(x, y);
    if (!s || s.type !== 'wall' || !s.built || s.team !== T) continue;
    const o = G.occ[idx(x, y)];
    if ((o && o !== u.id) || (taken && taken.has(x + ',' + y))) continue;
    const d = wallScore(T, u, x, y);
    if (d < bd){ bd = d; best = [x, y]; }
  }
  return best;
}
function findSpot(T, type, neutral){
  const sd = SDEF[type], tm = TEAM[T];
  const opts = [[sd.w, sd.h]]; if (sd.w !== sd.h) opts.push([sd.h, sd.w]);
  const rows = neutral ? [20, 29] : tm.rows;
  let best = null, bs = -1e9;
  for (const [w, h] of opts) for (let y = rows[0]; y <= rows[1] - h + 1; y++) for (let x = 0; x <= COLS - w; x++){
    if (!canPlace(T, type, x, y, w, h)) continue;
    let bad = false, m = 0;
    for (let dy = 0; dy < h && !bad; dy++) for (let dx = 0; dx < w; dx++){
      const X = x+dx, Y = y+dy;
      if (!neutral && (inCastle(T, X, Y, 2) || (X >= 23 && X <= 26 && (T === 0 ? Y < CASTLE[T].box.y0 : Y > CASTLE[T].box.y1)))) { bad = true; break; }
      if (neutral && (Y === 20 || Y === 29) && X >= 18 && X <= 31 && type !== 'tower') { bad = true; break; }
      if (sd.dep && DEP[idx(X, Y)] === sd.dep) m++;
    }
    if (bad) continue;
    const cy = y + h/2, cxm = x + w/2;
    let sc = Math.random() * .5;
    if (neutral){
      const depth = depthN(T, cy);
      if (sd.dep) sc += m * 10 - depth * .4 - Math.abs(cxm - MIDX) * .05;
      else if (type === 'tower') sc += 10 - Math.abs(depth - 4) * 2 - Math.abs(cxm - MIDX) * .1;
      else if (type === 'workshop') sc += 10 - Math.abs(depth - 2.5) * 2 - Math.abs(cxm - MIDX) * .08;
      else sc -= depth;
    } else {
      const depth = depthOwn(T, cy);
      if (sd.dep) sc += m * 10 + depth * .6;
      else if (type === 'tower') sc += 14 - depth * 2.2 - Math.abs(cxm - MIDX) * .15;
      else if (type === 'workshop') sc += -Math.abs(depth - 4) * 2;
      else sc += depth;
    }
    if (sc > bs){ bs = sc; best = {x, y, w, h}; }
  }
  return best;
}
function bridgeOn(y){ for (const s of G.structs.values()) if (s.type === 'bridge' && s.y === y) return true; return false; }
function aiThink(ai){
  const T = ai.team, E = 1 - T, tm = TEAM[T], R = G.res[T];
  const mine = [], ss = [];
  for (const u of G.units.values()) if (u.team === T) mine.push(u);
  for (const s of G.structs.values()) if (s.team === T) ss.push(s);
  const cnt = {}; ss.forEach(s => { if (!s.castle) cnt[s.type] = (cnt[s.type] || 0) + 1; });
  const army = mine.length;
  const free = u => u.order.type === 'idle';
  const nStructs = ss.filter(s => isNeutral(s.y));
  // 1) الدفاع: أعداء في أرضنا أو قرب منشآتنا في الأرض المحايدة
  const intr = [];
  for (const u of G.units.values()){
    if (u.team !== E) continue;
    if (inRows(T, u.cy) || nStructs.some(s => distPR(u.cx + .5, u.cy + .5, sRect(s)) < 4)) intr.push(u);
  }
  if (intr.length){
    for (const u of mine){
      if (!free(u) || u.type === 'trebuchet' || onOwnWall(u)) continue;
      let best = null, bd = 1e9;
      for (const e of intr){ const d = Math.hypot(e.cx - u.cx, e.cy - u.cy); if (d < bd){ bd = d; best = e; } }
      if (best && bd < 25) setOrder(u, {type:'attack', target:best});
    }
  }
  // 2) الإصلاح
  const dmgS = ss.find(s => s.built && !s.demo && s.hp < s.maxHp * .65 && !workersOn(s));
  if (dmgS && R[SDEF[dmgS.type].mat] > 15){ const w = nearestWorker(T, dmgS, true); if (w) orderWork(w, 'repair', dmgS); }
  // 3) سدّ الفجوات
  if (!ss.some(s => !s.built && (s.type === 'wall' || s.type === 'gate'))){
    const C = CASTLE[T];
    for (const [x, y] of C.ring){
      const i = idx(x, y);
      if (G.sg[i] || G.occ[i]) continue;
      const type = C.gateSet.has(x + ',' + y) ? 'gate' : 'wall';
      if (canAfford(T, SDEF[type].cost)) placeStruct(T, type, x, y, 1, 1);
      break;
    }
  }
  // 4) الجسور
  const econ = (cnt.lumber || 0) + (cnt.goldmine || 0) + (cnt.quarry || 0);
  if (econ >= 3 && !bridgeOn(tm.homeMoat) && canAfford(T, SDEF.bridge.cost)){
    const bx = (T === 1 ? [29, 20, 35, 14] : [20, 29, 14, 35]).find(x => canPlace(T, 'bridge', x, tm.homeMoat, 1, 2));
    if (bx != null) placeStruct(T, 'bridge', bx, tm.homeMoat, 1, 2);
  } else if (army >= 7 && !bridgeOn(tm.farMoat) && canAfford(T, SDEF.bridge.cost)){
    const bx = (T === 1 ? [29, 20, 35, 14] : [20, 29, 14, 35]).find(x => canPlace(T, 'bridge', x, tm.farMoat, 1, 2));

/* ---------- الإدخال باللمس: سحب للتنقل، قرص للتكبير، لمسة للأوامر ---------- */
const ptrs = new Map(); let gest = null;
function ppos(e){ const r = cv.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; }
function startPan(id, p, moved){ gest = {type:'pan', id, x0:p.x, y0:p.y, cx0:camX, cy0:camY, moved}; }
function bindInput(){
  cv.addEventListener('pointerdown', e => {
    try { cv.setPointerCapture(e.pointerId); } catch(_){}
    const p = ppos(e); ptrs.set(e.pointerId, p);
    if (ptrs.size === 1){
      startPan(e.pointerId, p, false);
    } else if (ptrs.size === 2){
      const [a, b] = [...ptrs.values()];
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      gest = {type:'pinch', d0:Math.max(10, Math.hypot(a.x - b.x, a.y - b.y)), z0:CS, vx:(mx + camX) / CS, vy:(my + camY) / CS};
    }
  });
  cv.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId) || !gest) return;
    const p = ppos(e); ptrs.set(e.pointerId, p);
    if (gest.type === 'pan'){
      if (e.pointerId !== gest.id) return;
      if (!gest.moved && Math.hypot(p.x - gest.x0, p.y - gest.y0) > 9) gest.moved = true;
      if (gest.moved){ camX = gest.cx0 - (p.x - gest.x0); camY = gest.cy0 - (p.y - gest.y0); clampCam(); }
    } else if (gest.type === 'pinch' && ptrs.size >= 2){
      const [a, b] = [...ptrs.values()];
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      CS = Math.max(minZoom(), Math.min(maxZoom(), gest.z0 * Math.hypot(a.x - b.x, a.y - b.y) / gest.d0));
      camX = gest.vx * CS - mx; camY = gest.vy * CS - my; clampCam();
    }
  });
  const up = e => {
    if (!ptrs.has(e.pointerId)) return;
    const p = ppos(e);
    if (gest && gest.type === 'pan' && gest.id === e.pointerId && !gest.moved && e.type === 'pointerup') onTap(p.x, p.y);
    ptrs.delete(e.pointerId);
    if (!ptrs.size) gest = null;
    else if (gest && gest.type === 'pinch'){ const [id, q] = [...ptrs.entries()][0]; startPan(id, q, true); }
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => { e.preventDefault(); const p = ppos(e); setZoom(CS * (e.deltaY < 0 ? 1.15 : 1 / 1.15), p.x, p.y); }, {passive:false});
}
const selIds = () => [...selection].filter(u => !u.dead).map(u => u.id);
function onTap(sx, sy){
  if (!G || G.demo || G.over || G.paused) return;
  const [wx, wy] = s2w(sx, sy), cx = Math.floor(wx), cy = Math.floor(wy);
  if (!inb(cx, cy)) return;
  if (placing){ setGhost(cx, cy); return; }
  const s = structAt(cx, cy);
  if (repairMode){
    repairMode = false; renderTab();
    if (s && s.team === ME && s.built && s.hp < s.maxHp && !s.demo){ act({c:'repair', id:s.id, ids:selIds()}); mark(s.x, s.y, '#fbbf24'); }

    return;
  }
  if (demoMode){
    if (s && s.team === ME && (DEMOLISHABLE.includes(s.type) || !s.built)){ demoMode = false; renderTab(); askDemolish(s); }

  }

  for (const u of G.units.values()){
    if (Math.abs(uCx(u) - wx) > 3 || Math.abs(uCy(u) - wy) > 3) continue;
    const d = Math.hypot(uCx(u) - wx, uCy(u) - wy) - (u.size - 1) * .7;
    if (d < hd){ hd = d; hit = u; }
  }
  if (hit && hit.team === ME){
    const wasEmpty = !selection.size;
    if (selection.has(hit)) selection.delete(hit); else selection.add(hit);
    if (wasEmpty && selection.size) setTab('cmd'); else refreshSel();
    return;
  }
  if (selection.size){
    const ids = selIds(), units = [...selection];
    if (hit && hit.team !== ME){ act({c:'attack', k:'u', id:hit.id, ids}); mark(cx, cy, '#ef4444'); return; }
    if (s && s.team !== ME){ act({c:'attack', k:'s', id:s.id, ids}); mark(cx, cy, '#ef4444'); return; }
    if (s && s.team === ME && s.demo){ act({c:'work', k:'demolish', id:s.id, ids}); mark(cx, cy, '#f87171'); toast('🪓 توجّه الجنود للهدم'); return; }

  }

    let msg = s.built ? `${sd.name} — ${Math.ceil(s.hp)}/${s.maxHp}` + (s.bonus > 1 ? ` • ★ إنتاج ×${s.bonus}` : '') : `${sd.name} — قيد البناء ${Math.floor(s.progress * 100)}%`;
    if (s.demo) msg = `${sd.name} — جارٍ الهدم`;
    else if (s.team === ME && DEMOLISHABLE.includes(s.type)) msg += ' • للهدم: 🪓 من «البناء»';
    toast(msg);
    if (s.team === ME && (s.type === 'keep' || s.type === 'workshop')) setTab('army');
  } else if (hit){
    toast(`${UDEF[hit.type].name} العدو — ${Math.ceil(hit.hp)}/${hit.maxHp}`);
  } else if (DEP[idx(cx, cy)]){
    const k = DEP[idx(cx, cy)];
    toast(`${isNeutral(cy) ? 'موقع غني' : 'موقع'} ${RNAME[k]} — ابنِ هنا ${k === 'gold' ? 'منجم ذهب' : k === 'iron' ? 'منجم حديد' : k === 'wood' ? 'معمل أخشاب' : 'معمل أحجار'} لإنتاج ×${isNeutral(cy) ? 2.2 : 1.7}`);
  } else if (isNeutral(cy)){
    toast('الأرض المحايدة — يحق لك ولعدوك البناء هنا');
  }
}
function mark(x, y, col){ markers.push({x, y, col, life:.7}); }
function cellOkFor(u, x, y, sel){
  const i = idx(x, y), o = G.occ[i];
  if (o && !sel.has(o)) return false;
  const sid = G.sg[i];
  if (sid){
    const s = G.structs.get(sid);

  }

}
function moveGroup(units, tx, ty){
  const sel = new Set(units.map(u => u.id)), cands = [];
  const R = Math.ceil(Math.sqrt(units.length)) + 2;
  for (let y = Math.max(0, ty - R); y <= Math.min(ROWS - 1, ty + R); y++) for (let x = Math.max(0, tx - R); x <= Math.min(COLS - 1, tx + R); x++) cands.push({x, y, d:Math.hypot(x - tx, y - ty)});
  cands.sort((a, b) => a.d - b.d);
  const used = new Set();
  const sorted = [...units].sort((a, b) => (b.type === 'archer') - (a.type === 'archer') || Math.hypot(a.cx - tx, a.cy - ty) - Math.hypot(b.cx - tx, b.cy - ty));

    if (u.type === 'trebuchet'){ setOrder(u, {type:'move', x:Math.min(COLS - 2, tx), y:Math.min(ROWS - 2, ty)}); continue; }
    const c = cands.find(c => !used.has(c.x + ',' + c.y) && cellOkFor(u, c.x, c.y, sel));

}

function execCmd(T, c){
  if (!G || !c) return;
  if (c.c === 'pause'){ setPaused(true); return; }

  if (G.over || G.paused) return;
  const us = (Array.isArray(c.ids) ? c.ids : []).map(id => G.units.get(id)).filter(u => u && u.team === T);
  switch (c.c){
    case 'train': cmdTrain(T, c.type); break;
    case 'place': cmdPlace(T, c, us); break;
    case 'move': if (us.length && inb(c.x, c.y)) moveGroup(us, c.x | 0, c.y | 0); break;
    case 'attack': { const t = c.k === 'u' ? G.units.get(c.id) : G.structs.get(c.id); if (t && !t.dead && t.team !== T) us.forEach(u => setOrder(u, {type:'attack', target:t})); break; }
    case 'work': { const s = G.structs.get(c.id); if (s && s.team === T && ['build','repair','demolish'].includes(c.k)) us.forEach(u => orderWork(u, c.k, s)); break; }
    case 'repair': cmdRepair(T, G.structs.get(c.id), us); break;
    case 'demo': cmdDemolish(T, G.structs.get(c.id), us); break;
    case 'grp': cmdGroup(T, c.k, us); break;
  }
}
function workshopOf(T){ return [...G.structs.values()].filter(s => s.team === T && s.type === 'workshop' && s.built && !s.demo).sort((a, b) => a.queue.length - b.queue.length)[0]; }
function missingFor(T, c){ return Object.keys(c).filter(k => G.res[T][k] < c[k]).map(k => `${RICON[k]} ينقصك ${Math.ceil(c[k] - G.res[T][k])}`).join('، '); }
function cmdTrain(T, type){
  if (!UDEF[type]) return;
  const prod = type === 'trebuchet' ? workshopOf(T) : G.keep[T];
  if (!prod || prod.dead){ notify(T, 'ابنِ «معمل المنجنيق» أولاً — والأفضل في الأرض المحايدة'); return; }
  if (prod.queue.length >= 30){ notify(T, 'قائمة التدريب ممتلئة'); return; }
  const c = UDEF[type].cost;
  if (!canAfford(T, c)){ notify(T, missingFor(T, c)); return; }
  pay(T, c); prod.queue.push({type, t:0});
  notify(T, '⏳ بدأ تدريب: ' + UDEF[type].name);
}
function cmdPlace(T, c, us){
  const sd = SDEF[c.type];
  if (!sd || !sd.cost) return;
  const okDims = (c.w === sd.w && c.h === sd.h) || (c.type !== 'bridge' && c.w === sd.h && c.h === sd.w);
  if (!okDims || !canPlace(T, c.type, c.x, c.y, c.w, c.h)){ notify(T, 'الموقع غير صالح'); return; }
  if (!canAfford(T, sd.cost)){ notify(T, missingFor(T, sd.cost)); return; }
  const builders = us.filter(u => u.type !== 'trebuchet');
  const s = placeStruct(T, c.type, c.x, c.y, c.w, c.h, builders);
  if (!s) return;
  if (!builders.length){ const u = nearestWorker(T, s, true); if (u){ orderWork(u, 'build', s); notify(T, '🔨 بدأ البناء: ' + sd.name); } else notify(T, '⏳ سيبدأ البناء حين يتوفر جندي'); }
  else notify(T, '🔨 بدأ البناء: ' + sd.name);
}
function cmdRepair(T, s, us){
  if (!s || s.dead || s.team !== T || !s.built || s.hp >= s.maxHp || s.demo) return;
  let ws = us.filter(u => u.type !== 'trebuchet');
  if (!ws.length){ const u = nearestWorker(T, s, true) || nearestWorker(T, s, false); if (u) ws = [u]; }
  if (!ws.length){ notify(T, 'لا يوجد جندي متاح للإصلاح'); return; }
  ws.forEach(u => orderWork(u, 'repair', s));
  notify(T, '🔧 بدأ الإصلاح');
}
function cmdDemolish(T, s, us){
  if (!s || s.dead || s.team !== T || !(DEMOLISHABLE.includes(s.type) || !s.built)) return;
  if (s.demo){
    s.demo = false;
    for (const u of G.units.values()) if (u.order.type === 'demolish' && u.order.target === s) setIdle(u);
    notify(T, '✋ أُوقف الهدم'); return;
  }
  s.demo = true;
  for (const u of G.units.values()) if ((u.order.type === 'build' || u.order.type === 'repair') && u.order.target === s) setIdle(u);
  let ws = us.filter(u => u.type !== 'trebuchet');
  if (!ws.length){ const u = nearestWorker(T, s, true) || nearestWorker(T, s, false); if (u) ws = [u]; }
  ws.forEach(u => orderWork(u, 'demolish', s));
  notify(T, ws.length ? '🪓 جندي في طريقه لهدم ' + SDEF[s.type].name : '⏳ سيبدأ الهدم حين يتوفر جندي');
}
function cmdGroup(T, k, sel){
  if (!sel.length) return;
  if (k === 'assault'){ sel.forEach(u => setOrder(u, {type:'assault'})); notify(T, '⚔️ إلى قلعة العدو!'); }
  else if (k === 'stop'){ sel.forEach(setIdle); notify(T, '✋ ثبات في المواقع'); }
  else if (k === 'wall' || k === 'defend'){
    const archers = sel.filter(u => u.type === 'archer'); let placed = 0;
    for (const u of archers){ const w = freeWallCellExcl(T, u); if (w){ setOrder(u, {type:'move', x:w[0], y:w[1]}); placed++; } }
    if (k === 'defend'){
      const b = CASTLE[T].box, others = sel.filter(u => u.type !== 'archer' && u.type !== 'trebuchet');
      if (others.length) moveGroup(others, MIDX, T === 0 ? b.y0 - 2 : b.y1 + 2);
      sel.filter(u => u.type === 'trebuchet').forEach(u => setOrder(u, {type:'assault'}));
      notify(T, '🛡️ اتخاذ مواقع دفاعية');
    }
    else notify(T, archers.length ? (placed ? '🧱 الرماة يعتلون السور' : 'لا توجد أماكن شاغرة على السور') : 'هذا الأمر للرماة فقط');
  }
}
function freeWallCellExcl(T, u){
  const taken = new Set([...G.units.values()].filter(v => v !== u && v.order.type === 'move').map(v => v.order.x + ',' + v.order.y));
  return freeWallCell(T, u, taken);
}

/* ================== اللعب الثنائي: المزامنة ==================
   المضيف يشغّل المحاكاة الكاملة ويرسل «لقطة» للضيف عشر مرات في الثانية،
   والضيف يرسل أوامره فقط. هذا يمنع اختلاف الحالة بين الهاتفين. */
const NETV = 2;
const UT = ['footman','archer','knight','trebuchet'], ST = Object.keys(SDEF), OT = ['idle','move','attack','assault','build','repair','demolish'];
function netSend(o){ if (NET.connected && NET.send) try { NET.send(o); } catch(e){} }
function sigOf(s){ return Math.ceil(s.hp) + '|' + (s.built ? 1 : 0) + '|' + ((s.progress * 100) | 0) + '|' + (s.demo ? 1 : 0) + '|' + (s.queue ? s.queue.map(q => q.type[0] + ((q.t * 10) | 0)).join(',') : ''); }
function makeSnap(){
  const full = G.netFull; G.netFull = false;
  const u = [];
  for (const x of G.units.values()){
    const o = x.order, mv = o.type === 'move';
    u.push([x.id, UT.indexOf(x.type), x.team, r2(x.px), r2(x.py), Math.ceil(x.hp), x.cx, x.cy, x.moving ? 1 : 0, OT.indexOf(o.type), mv ? o.x : -1, mv ? o.y : -1, r1(Math.max(0, x.fire)), r1(Math.max(0, x.cd)), x.lunge > 0 ? r1(x.lx) : 0, x.lunge > 0 ? r1(x.ly) : 0]);
  }
  const s = [];
  for (const x of G.structs.values()){
    const sg = sigOf(x);
    if (!full && x._sig === sg) continue;
    x._sig = sg;
    s.push([x.id, ST.indexOf(x.type), x.team, x.x, x.y, x.w, x.h, Math.ceil(x.hp), x.maxHp, x.built ? 1 : 0, (x.progress * 100) | 0, x.demo ? 1 : 0, x.castle ? 1 : 0, Math.round(x.bonus * 10), x.queue ? x.queue.map(q => [UT.indexOf(q.type), r1(q.t)]) : 0]);
  }
  const R = G.res[1];
  const snap = {m:'s', t:r1(G.t), full:full ? 1 : 0, u, s, sr:G.nRm, p:G.nProj, f:G.nFx, e:G.nEv,
    r:[R.gold | 0, R.iron | 0, R.wood | 0, R.stone | 0], pa:G.paused ? 1 : 0, ov:G.over ? G.winner : -1};
  G.nRm = []; G.nProj = []; G.nFx = []; G.nEv = [];
  return snap;
}
function guestShell(){
  G = {t:0, diff:'normal', demo:false, mp:true, units:new Map(), structs:new Map(), nid:1,
       occ:new Int32Array(COLS*ROWS), sg:new Int32Array(COLS*ROWS),
       res:[{gold:0,iron:0,wood:0,stone:0},{gold:0,iron:0,wood:0,stone:0}],
       proj:[], fx:[], pings:[], keep:[null,null], ai:[null,null], over:false, winner:-1,
       paused:false, speed:1, overT:0, shake:0, lastAlert:null, alertT:[-99,-99], pingT:[0,0], lastSnap:performance.now(), gotFull:false};
}
function applySnap(m){
  G.lastSnap = performance.now();
  if (m.full) G.gotFull = true;
  else if (!G.gotFull){ netSend({m:'full'}); return; }
  G.t = m.t;
  const R = G.res[ME]; [R.gold, R.iron, R.wood, R.stone] = m.r;
  // الوحدات
  const seen = new Set();
  for (const a of m.u){
    let u = G.units.get(a[0]);
    if (!u){
      const type = UT[a[1]], d = UDEF[type];
      u = {kind:'u', id:a[0], type, team:a[2], size:d.size, maxHp:d.hp, hp:a[5], px:a[3], py:a[4], cx:a[6], cy:a[7], order:{type:'idle'}, hitT:0, lunge:0, lx:0, ly:0, fire:0, cd:0, dead:false};
      G.units.set(u.id, u);
    }
    if (a[5] < u.hp) u.hitT = .15;
    u.hp = a[5]; u.tx = a[3]; u.ty = a[4]; u.cx = a[6]; u.cy = a[7]; u.moving = !!a[8];
    u.order = {type:OT[a[9]] || 'idle', x:a[10], y:a[11]};
    u.fire = a[12]; u.cd = a[13];
    if (a[14] || a[15]){ u.lunge = .15; u.lx = a[14]; u.ly = a[15]; }
    seen.add(u.id);
  }
  let selChanged = false;
  for (const u of [...G.units.values()]) if (!seen.has(u.id)){ u.dead = true; G.units.delete(u.id); if (selection.delete(u)) selChanged = true; }
  if (selChanged) refreshSel();
  // المنشآت
  let sgDirty = false;
  if (m.full){
    const ids = new Set(m.s.map(a => a[0]));
    for (const s of [...G.structs.values()]) if (!ids.has(s.id)){ s.dead = true; G.structs.delete(s.id); sgDirty = true; }
  }

const b64u = bytes => { let s = ''; for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };

  <p class="st" id="ovSt">${navigator.onLine === false ? '⚠️ يبدو أن هذا الهاتف غير متصل بالإنترنت' : ''}</p>
  <button class="big alt" id="bBack">رجوع</button>`);
  $('bBack').onclick = showMP;
  $('bCreate').onclick = () => {
    const code = genCode();
    showOv(`<h1>🌐 غرفتك جاهزة</h1><p class="sub">أعطِ هذا الرمز للاعب الآخر ليختار «انضمام»</p>
      <div class="bigcode" dir="ltr">${code}</div>
      <div class="row2b"><button class="sm" id="bCp">📋 نسخ</button><button class="sm" id="bSh">📤 مشاركة</button></div>
      <p class="st" id="ovSt"><span class="spin"></span> بانتظار انضمام اللاعب الآخر…</p>
      <button class="big alt" id="bBack">إلغاء</button>`);
    $('bCp').onclick = () => copyText(code); $('bSh').onclick = () => shareText('انضم إليّ في «حصار القلاع» — رمز الغرفة: ' + code);
    $('bBack').onclick = showAuto;
    autoConnect(code, 'host');
  };
  const join = () => {
    const code = ($('inCode').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length !== 5){ netStatus('الرمز يتكون من ٥ أحرف'); return; }
    showOv(`<h1>🌐 انضمام</h1><div class="bigcode" dir="ltr">${code}</div>
      <p class="st" id="ovSt"><span class="spin"></span> جارٍ البحث عن الغرفة…</p>
      <button class="big alt" id="bBack">إلغاء</button>`);
    $('bBack').onclick = showAuto;
    autoConnect(code, 'guest');
  };
  $('bJoin').onclick = join;
  $('inCode').addEventListener('keydown', e => { if (e.key === 'Enter') join(); });
}
function showOffline(){
  netReset();
  showOv(`<h1>📶 بدون إنترنت</h1><p class="sub">صِل الهاتفين بالشبكة نفسها (أو شغّل نقطة اتصال على أحدهما واتصل بها من الآخر)، وافتح اللعبة على كليهما.</p>
  <button class="opt" id="bH"><b>👑 أنا المضيف</b><small>أعرض رمزاً يمسحه الضيف</small></button>
  <button class="opt" id="bG"><b>🎯 أنا الضيف</b><small>أمسح رمز المضيف</small></button>
  <button class="big alt" id="bBack">رجوع</button>`);
  $('bBack').onclick = showMP; $('bH').onclick = offHostScreen; $('bG').onclick = offGuestScreen;
}
function codeTools(code){
  return `<canvas id="qr" class="qr"></canvas>
  <div class="row2b"><button class="sm" id="bCp">📋 نسخ الرمز</button><button class="sm" id="bSh">📤 مشاركة</button></div>`;
}
function scanTools(btnTxt){
  return `<button class="big" id="bScan">📷 ${btnTxt}</button>
  <video id="vid" class="vid hidden" playsinline muted></video>
  <details class="paste"><summary>أو الصق الرمز يدوياً</summary><textarea id="taCode" dir="ltr" placeholder="HQ…"></textarea><button class="big alt" id="bPaste">متابعة</button></details>`;
}
async function offHostScreen(){
  showOv(`<h1>👑 المضيف</h1><p class="st" id="ovSt"><span class="spin"></span> جارٍ إنشاء الرمز…</p>`);
  let code;
  try { code = await offHostCreate(); } catch(e){ netStatus('تعذّر إنشاء الاتصال على هذا المتصفح'); return; }
  showOv(`<h1>👑 المضيف</h1>
    <div class="step">١. اعرض هذا الرمز على هاتف الضيف ليمسحه</div>${codeTools(code)}
    <div class="step">٢. بعد أن يظهر رمز على هاتف الضيف، امسحه من هنا</div>${scanTools('مسح رمز الضيف')}
    <p class="st" id="ovSt"></p><button class="big alt" id="bBack">إلغاء</button>`);
  drawQR($('qr'), code);
  $('bCp').onclick = () => copyText(code); $('bSh').onclick = () => shareText(code);
  $('bBack').onclick = showOffline;
  const accept = async txt => {
    try { await offHostAccept(txt); netStatus('⏳ جارٍ الاتصال بالضيف…'); }
    catch(e){ netStatus(e && e.message && /[؀-ۿ]/.test(e.message) ? e.message : 'الرمز غير صالح، حاول مجدداً'); return; }
    NET.wait = setTimeout(() => { if (!NET.connected) netStatus('⌛ تعذّر الاتصال. تأكد أن الهاتفين على الشبكة نفسها ثم أعد المحاولة.'); }, 20000);
  };
  $('bScan').onclick = () => startScan($('vid'), accept);
  $('bPaste').onclick = () => accept($('taCode').value);
}
function offGuestScreen(){
  showOv(`<h1>🎯 الضيف</h1>
    <div class="step">١. امسح الرمز الظاهر على هاتف المضيف</div>${scanTools('مسح رمز المضيف')}
    <p class="st" id="ovSt"></p><button class="big alt" id="bBack">رجوع</button>`);
  $('bBack').onclick = showOffline;
  const got = async txt => {
    netStatus('⏳ جارٍ تجهيز رمز الرد…');
    let code;
    try { code = await offGuestAnswer(txt); }
    catch(e){ netStatus(e && e.message && /[؀-ۿ]/.test(e.message) ? e.message : 'الرمز غير صالح، حاول مجدداً'); return; }
    showOv(`<h1>🎯 الضيف</h1>
      <div class="step">٢. اعرض هذا الرمز على هاتف المضيف ليمسحه</div>${codeTools(code)}
      <p class="st" id="ovSt"><span class="spin"></span> بانتظار أن يمسح المضيف الرمز…</p>
      <button class="big alt" id="bBack">إلغاء</button>`);
    drawQR($('qr'), code);
    $('bCp').onclick = () => copyText(code); $('bSh').onclick = () => shareText(code);
    $('bBack').onclick = showOffline;
    NET.wait = setTimeout(() => { if (!NET.connected) netStatus('⌛ لم يكتمل الاتصال بعد. تأكد أن المضيف مسح الرمز وأن الهاتفين على الشبكة نفسها.'); }, 40000);
  };
  $('bScan').onclick = () => startScan($('vid'), got);
  $('bPaste').onclick = () => got($('taCode').value);
}
function showLobby(){
  clearTimeout(NET.wait);
  const via = NET.mode === 'off' ? '📶 عبر الشبكة المحلية' : '🌐 عبر الإنترنت';
  if (NET.role === 'host'){
    showOv(`<h1>✅ تم الاتصال</h1><p class="sub">${via}<br>أنت 🔵 الأزرق، وصديقك 🔴 الأحمر</p>
      <button class="big" id="bGo">ابدأ المعركة</button><p class="st" id="ovSt"></p><button class="big alt" id="bLeave">مغادرة</button>`);
    $('bGo').onclick = hostStartMatch;
  } else {
    showOv(`<h1>✅ تم الاتصال</h1><p class="sub">${via}<br>أنت 🔴 الأحمر</p>
      <p class="st" id="ovSt"><span class="spin"></span> بانتظار المضيف لبدء المعركة…</p><button class="big alt" id="bLeave">مغادرة</button>`);
  }
  $('bLeave').onclick = leaveMatch;
}
function homeView(){ CS = Math.max(minZoom(), Math.min(maxZoom(), Math.max(20, W / 16))); const C = CASTLE[ME]; centerOn(C.cx, C.cy + (ME ? 1 : -1)); }
function startGame(){
  netReset(); ME = 0; FLIP = false;
  newGame(menuDiff, false);
  hideOv(); cancelPlace();
  $('btnSpeed').textContent = '×1';
  applyTeamLook(); homeView();
  setTab('army'); refreshSel(); updateHud();
  setTimeout(() => toast('اسحب للتنقل • قرّب بإصبعين • المس جنودك لتحديدهم'), 400);
}
function showPause(){
  const mp = G && G.mp;
  showOv(`<h1>⏸ استراحة</h1><p class="sub">الوقت ${$('clock').textContent} — ${mp ? 'لاعبان' : DIFF[G.diff].name}</p>
  <button class="big" id="bRes">متابعة</button><button class="big alt" id="bRe">${mp ? 'مغادرة المباراة' : 'معركة جديدة'}</button>${HOWTO}`);
  $('bRes').onclick = () => { if (mp) act({c:'resume'}); else { G.paused = false; hideOv(); } };
  $('bRe').onclick = () => { if (mp) leaveMatch(); else { G = null; startDemo(); showMenu(); } };
}
function showEnd(){
  if (!G) return;
  const win = G.winner === ME, mp = G.mp;
  showOv(`<h1>${win ? '🏆 انتصار!' : '🏳️ هزيمة'}</h1>
  <p class="res-end">${win ? 'استوليت على قلعة العدو' : 'سقطت قلعتك في يد العدو'}<br>مدة المعركة: ${$('clock').textContent} — ${mp ? 'لاعبان' : DIFF[G.diff].name}</p>
  <button class="big" id="bAgain">${mp ? 'مباراة ثأرية' : 'معركة جديدة'}</button><p class="st" id="ovSt"></p><button class="big alt" id="bMenu">القائمة</button>`);
  buzz(win ? [60, 40, 120] : 200);
  $('bAgain').onclick = () => {
    if (!mp) startGame();
    else if (NET.role === 'host') hostStartMatch();
    else { netSend({m:'rematch'}); netStatus('⏳ بانتظار المضيف…'); }
  };
  $('bMenu').onclick = () => { if (mp) leaveMatch(); else { startDemo(); showMenu(); } };
}
function startDemo(){ ME = 0; FLIP = false; newGame('normal', true); CS = Math.max(minZoom(), Math.min(maxZoom(), W / 22)); centerOn(MIDX, 25); }

function loop(ts){
  const dt = Math.min(.05, (ts - lastTs) / 1000 || 0); lastTs = ts;
  if (G){
    if (G.mp && NET.role === 'guest') guestTick(dt);
    else if (!G.paused && !G.over){ for (let k = 0; k < G.speed; k++) update(dt); }
    else if (G.over){ updateFx(dt); G.overT += dt; if (G.demo && G.overT > 4) startDemo(); }
    if (G.demo && !G.over){ centerOn(MIDX + Math.sin(ts / 9000) * 12, 25 + Math.sin(ts / 6000) * 14); }
    prodPops(dt);
    if (G.mp && NET.connected){
      if (NET.role === 'host'){ NET.snapT -= dt; if (NET.snapT <= 0){ NET.snapT = .1; netSend(makeSnap()); } }
      else { NET.pingT -= dt; if (NET.pingT <= 0){ NET.pingT = 1; netSend({m:'p'}); } }
    }
  }
  render();
  uiTick += dt;
  if (uiTick > .2){ uiTick = 0; if (G && !G.demo) updateHud(); }
  requestAnimationFrame(loop);
}
function boot(){
  cv = $('cv'); ctx = cv.getContext('2d');
  buildResBar();
  buildTerrain();
  $('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setTab(b.dataset.tab); });
  $('tabBody').addEventListener('click', onPanelClick);
  $('pRot').onclick = () => { if (placing && placing.type !== 'bridge'){ [placing.w, placing.h] = [placing.h, placing.w]; if (placing.x != null) setGhost(placing.x, placing.y); } };
  $('pOk').onclick = confirmPlace;
  $('pNo').onclick = cancelPlace;
  $('zIn').onclick = () => setZoom(CS * 1.3, W / 2, H / 2);
  $('zOut').onclick = () => setZoom(CS / 1.3, W / 2, H / 2);
  $('zHome').onclick = () => { if (G && !G.demo) homeView(); };
  $('zAlert').onclick = () => { if (G && G.lastAlert) centerOn(G.lastAlert.x, G.lastAlert.y); };
  $('btnPause').onclick = () => { if (!G || G.demo || G.over || G.paused) return; if (G.mp) act({c:'pause'}); else { G.paused = true; showPause(); } };
  $('btnSpeed').onclick = () => { if (!G || G.demo || G.mp) return; G.speed = G.speed === 1 ? 2 : 1; $('btnSpeed').textContent = '×' + G.speed; };
  bindInput();
  window.addEventListener('resize', () => setTimeout(resize, 60));
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden || !G || G.demo || G.over || G.paused) return;
    if (G.mp){ if (NET.connected) act({c:'pause'}); } else { G.paused = true; showPause(); }
  });
  window.addEventListener('pagehide', () => { if (NET.connected) netSend({m:'bye'}); });
  document.addEventListener('gesturestart', e => e.preventDefault());
  resize();
  startDemo();
  renderTab();
  applyTeamLook();
  showMenu();
  requestAnimationFrame(loop);
}
if (!HEADLESS) boot();
</script>
</body>
</html>
